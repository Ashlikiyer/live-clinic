name: Daily cleanup

# Rolls expired sessions into daily_stats, then deletes them (sessions live 24 hours).
# Needs repository secrets API_URL (e.g. https://<app>.onrender.com) and CRON_SECRET.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Manila
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Roll up stats and delete expired sessions
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL or CRON_SECRET secret not set yet; skipping."
            exit 0
          fi
          # Render's free tier may be asleep: the first request wakes it, so allow retries.
          curl --fail-with-body --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/api/internal/cleanup"
